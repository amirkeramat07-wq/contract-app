name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: بررسی نحو اندپوینت‌های سرور
        run: for f in api/*.js; do echo "checking $f"; node --check "$f"; done
      - name: بررسی اپ و سیاست‌های امنیتی
        run: node tools/check-app.mjs
